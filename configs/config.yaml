# NFL project — Combine-to-Game Movement Translation (CGMT)
# Single source of truth for paths, business rules, cross-validation scheme and search grids.
# Every change here is recorded in CHANGELOG.md and bumps the pipeline version.

project: cgmt
seed: 42                           # global seed: Python, NumPy, PYTHONHASHSEED and every model's random_state

paths:                             # relative to the repository root
  raw: data/raw                    # original data (Parquet, CSV or compressed CSV .csv.gz; read-only)
  interim: data/clean/interim      # cleaned tracking frames and play context
  processed: data/clean            # clean, model-ready data (parquet)
  manifest: data/raw/manifest.json # SHA-256 hash and format of every original file + data_version
  reports: reports
  figures: reports/figures
  metrics: reports/metrics

raw_files:                         # names or glob patterns (docs/Data_structure_CSV_files.docx)
  combine: "combine_results.*"
  players: "players.*"
  careers: "player_career_successes.*"
  games: "games.*"
  tracking: "game_tracking_*"      # spec: game_tracking_2023/2024/2025.csv; delivered as parts
                                   # (_2023_5, _2024_1_5, _2024_2, _2025_2)
  player_play: "player_play*"      # spec: player_play.csv; delivered as player_play_3
  combine_tracking: "combine_tracking*"   # spec file 3: Combine drill tracking
                                   # a part <stem>_<n> is ignored when the full <stem> file is present;
                                   # .parquet, .csv and .csv.gz are all accepted: the format is detected from
                                   # the file content, and when one table exists in several formats the
                                   # priority is parquet > csv > csv.gz

contract:
  path: configs/data_contract.yaml # validated on every data stage -> reports/metrics/data_contract_*
  fail_on_error: true              # missing required file/column, duplicate key or broken foreign key

mlflow:
  tracking_uri: sqlite:///mlflow/mlflow.db
  artifact_location: mlflow/mlartifacts
  experiment: cgmt-combine-translation
  register_models: true
  regressor_name: cgmt-snap-burst-regressor        # suffix -dl / -wr for defensive line and wide receivers
  onfield_regressor_prefix: cgmt-onfield            # + "-<task>" for the on-field targets
  classifier_name: cgmt-starter-classifier

business_rules:
  last_completed_season: 2025      # the careers table covers seasons up to 2025
  games_per_season: 17
  starter_threshold: 0.5           # starter = started >= 50% of the available regular-season games
  undrafted_pick: 260              # after the last observed pick (257)
  draft_reference_month_day: "04-27"   # approximate draft weekend, for age at draft
  power_conferences:
    - Southeastern Conference
    - Big Ten Conference
    - Atlantic Coast Conference
    - Big Twelve Conference
    - Pacific Twelve Conference
  drill_valid_ranges:              # R1: values outside the range become NaN (measurement error)
    combine_height: [64, 84]
    combine_weight: [140, 400]
    hand_size: [7, 12]
    arm_length: [27, 38]
    wing_span: [66, 90]
    ten_yd_split: [1.30, 2.20]
    forty: [4.10, 6.00]
    vertical: [15, 50]
    broad_jump: [70, 150]
    three_cone: [6.20, 9.00]
    short_shuttle: [3.70, 5.60]
    bench_reps: [0, 50]

tracking_rules:
  season_types: [REG, POST]        # R8b: preseason is excluded (98 games, 390,373 frames)
  frame_rate_hz: 10
  snap_events: [ball_snap, snap_direct]
  min_post_snap_frames: 20         # R8: a full 2.0 s after the snap is required
  burst_horizon_s: 2.0             # main metric: distance covered at t = 2.0 s
  get_off_horizon_s: 1.0
  cut_window_s: 0.5
  cut_min_speed: 2.0               # yd/s at both ends of the cut window
  speed_cap: 12.5                  # yd/s (~25.6 mph); above it = sensor glitch
  accel_cap: 15.0                  # yd/s^2
  min_plays_per_player: 3          # R9
  capacity_quantile: 0.80          # sensitivity only: biased low with few plays (CHANGELOG 0.4.0)
  sbi_center: 50                   # Snap Burst Index scale: 50 + 10 * z
  sbi_scale: 10

performance_rules:                 # on-field performance from player_play
  season_types: [REG]              # R10: the challenge asks about regular-season performance
  exclude_nullified: true          # R11: plays nullified by penalty do not count
  valid_downs: [1, 2, 3, 4]        # R15: down 0 = two-point conversions (spec: 1-4)
  alignment_codes:                 # lined_up_position -> alignment cell; codes in the data + in the spec (DE, DT, NT)
    DL: {EDGE: EDGE, DE: EDGE, INTERIOR_LINE: INTERIOR_LINE, DT: INTERIOR_LINE, NT: INTERIOR_LINE}
    OL: {T: T, G: G, C: C}
    WRTE: {WR: WR, SLOT_WR: SLOT_WR, TE: TE}
                                   # anything else -> OTHER (OLB stays in OTHER: off-ball or stand-up alignment)
  families:                        # Combine position -> on-field family with a measurable outcome
    DL: DL
    OL: OL
    WR: WRTE
    TE: WRTE
  get_off_valid_s: [0.30, 2.00]    # R12: NGS get-off outside this range = tracking artefact (21 plays, < 0.1%)
  dropback_quantiles: 5            # OL expectation: alignment x dropback-duration quintile
  min_plays:                       # R13: minimum valid plays for a player metric
    dl_rush: 20
    ol_pass_block: 50
    wrte_route: 30
  primary_metric:                  # one on-field index per family (used by the classifiers)
    DL: proe
    OL: ppoe
    WRTE: soe

combine_tracking_rules:            # R16, spec file 3 (combine_tracking_6)
  frame_rate_hz: 10
  start_speed: 0.5                 # yd/s: the attempt starts on the frame before the first one at this speed
  min_frames: 15                   # attempts shorter than 1.5 s after the start are dropped
  speed_cap: 12.5                  # same physical caps as in-game tracking
  accel_cap: 15.0
  plant_drop: 0.5                  # a plant = a speed minimum below 50% of the preceding peak (3-cone, shuttle)
  cut_window_s: 0.5
  cut_min_speed: 2.0
  min_reliability: 0.5             # a drill metric becomes a feature only if it repeats at r >= 0.5

cv:
  outer_splits: 5                  # nested cross-validation: 5 folds x 3 repeats outside
  outer_repeats: 3
  inner_splits: 3                  # 3-fold GridSearchCV inside
  bootstrap_resamples: 2000

regression:
  populations: [all_positions, defensive_line, wide_receivers]   # single positions = where snap burst is a
                                   # reliable trait (DL ICC 0.63, WR 0.62 with full-season tracking)
  target: sbi                      # Snap Burst Index: within-position z of the shrunk 2-s burst (50 +/- 10)
  combine_tracking_comparison: true   # athletic vs athletic + drill tracking (only with the combine_tracking file)
  onfield_tasks:                   # Combine -> on-field performance (shrunk, over expected)
    - {name: dl_getoff, positions: [DL], target: goe_eb, label: "DL get-off over expected (s)"}
    - {name: dl_pressure, positions: [DL], target: proe_eb, label: "DL pressure rate over expected"}
    - {name: ol_protection, positions: [OL], target: ppoe_eb, label: "OL pressure prob. over expected"}
    - {name: wrte_separation, positions: [WR, TE], target: soe_eb, label: "WR/TE separation over expected (yd)"}
  grids:
    ridge:
      model__alpha: [1.0, 10.0, 100.0, 300.0, 1000.0]
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3, 6, null]
      model__min_samples_leaf: [3, 10]
      model__max_features: [0.33, 0.66]
    xgboost:
      model__n_estimators: [200, 400]
      model__max_depth: [2, 3]
      model__learning_rate: [0.03, 0.1]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3, 8]
      model__reg_lambda: [1.0]

classification:
  target: is_starter
  projector_alpha: 10.0            # Ridge penalty of the stacked Combine -> on-field projector
  projector_inner_folds: 5         # out-of-fold projections for the training rows
  scoring: roc_auc
  decision_threshold: 0.5
  grids:
    logistic_regression:
      model__C: [0.01, 0.1, 1.0, 10.0]
      model__l1_ratio: [0.0, 1.0]     # 0 = ridge (L2), 1 = lasso (L1)
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3, 6, null]
      model__min_samples_leaf: [3, 10]
      model__max_features: [0.33, 0.66]
    xgboost:
      model__n_estimators: [200, 400]
      model__max_depth: [2, 3]
      model__learning_rate: [0.03, 0.1]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3, 8]
      model__reg_lambda: [1.0]
