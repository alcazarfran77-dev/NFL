# Smoke configuration for CI and quick checks: same code, minimal cross-validation and grids,
# and its own output folders so a quick run never overwrites the release results.
# Approximate duration: 10 minutes on 2 cores.
project: cgmt
seed: 42
paths:
  raw: data/raw
  interim: data/smoke/interim
  processed: data/smoke/clean
  manifest: data/smoke/manifest.json
  reports: reports/smoke
  figures: reports/smoke/figures
  metrics: reports/smoke/metrics
raw_files:
  combine: "combine_results.*"
  players: "players.*"
  careers: "player_career_successes.*"
  games: "games.*"
  tracking: "game_tracking_*"
  player_play: "player_play*"
  combine_tracking: "combine_tracking*"
contract:
  path: configs/data_contract.yaml
  fail_on_error: true
mlflow:
  tracking_uri: sqlite:///mlflow/smoke.db
  artifact_location: mlflow/smoke_artifacts
  experiment: cgmt-smoke
  register_models: true
  regressor_name: cgmt-snap-burst-regressor
  onfield_regressor_prefix: cgmt-onfield
  classifier_name: cgmt-starter-classifier
business_rules:
  last_completed_season: 2025
  games_per_season: 17
  starter_threshold: 0.5
  undrafted_pick: 260
  draft_reference_month_day: "04-27"
  power_conferences:
  - Southeastern Conference
  - Big Ten Conference
  - Atlantic Coast Conference
  - Big Twelve Conference
  - Pacific Twelve Conference
  drill_valid_ranges:
    combine_height: [64, 84]
    combine_weight: [140, 400]
    hand_size: [7, 12]
    arm_length: [27, 38]
    wing_span: [66, 90]
    ten_yd_split: [1.3, 2.2]
    forty: [4.1, 6.0]
    vertical: [15, 50]
    broad_jump: [70, 150]
    three_cone: [6.2, 9.0]
    short_shuttle: [3.7, 5.6]
    bench_reps: [0, 50]
tracking_rules:
  season_types: [REG, POST]
  frame_rate_hz: 10
  snap_events: [ball_snap, snap_direct]
  min_post_snap_frames: 20
  burst_horizon_s: 2.0
  get_off_horizon_s: 1.0
  cut_window_s: 0.5
  cut_min_speed: 2.0
  speed_cap: 12.5
  accel_cap: 15.0
  min_plays_per_player: 3
  capacity_quantile: 0.8
  sbi_center: 50
  sbi_scale: 10
performance_rules:
  season_types: [REG]
  exclude_nullified: true
  valid_downs: [1, 2, 3, 4]
  alignment_codes:
    DL: {EDGE: EDGE, DE: EDGE, INTERIOR_LINE: INTERIOR_LINE, DT: INTERIOR_LINE, NT: INTERIOR_LINE}
    OL: {T: T, G: G, C: C}
    WRTE: {WR: WR, SLOT_WR: SLOT_WR, TE: TE}
  families:
    DL: DL
    OL: OL
    WR: WRTE
    TE: WRTE
  get_off_valid_s: [0.3, 2.0]
  dropback_quantiles: 5
  min_plays:
    dl_rush: 20
    ol_pass_block: 50
    wrte_route: 30
  primary_metric:
    DL: proe
    OL: ppoe
    WRTE: soe
cv:
  outer_splits: 2
  outer_repeats: 1
  inner_splits: 2
  bootstrap_resamples: 50
regression:
  populations: [all_positions, defensive_line, wide_receivers]
  target: sbi
  onfield_tasks:
  - {name: dl_getoff, positions: [DL], target: goe_eb, label: "DL get-off over expected (s)"}
  - {name: dl_pressure, positions: [DL], target: proe_eb, label: "DL pressure rate over expected"}
  - {name: ol_protection, positions: [OL], target: ppoe_eb, label: "OL pressure prob. over expected"}
  - {name: wrte_separation, positions: [WR, TE], target: soe_eb, label: "WR/TE separation over expected (yd)"}
  grids:
    ridge:
      model__alpha: [1.0]
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3]
      model__min_samples_leaf: [3]
      model__max_features: [0.33]
    xgboost:
      model__n_estimators: [200]
      model__max_depth: [2]
      model__learning_rate: [0.03]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3]
      model__reg_lambda: [1.0]
classification:
  target: is_starter
  projector_alpha: 10.0
  projector_inner_folds: 5
  scoring: roc_auc
  decision_threshold: 0.5
  grids:
    logistic_regression:
      model__C: [0.01]
      model__l1_ratio: [0.0]
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3]
      model__min_samples_leaf: [3]
      model__max_features: [0.33]
    xgboost:
      model__n_estimators: [200]
      model__max_depth: [2]
      model__learning_rate: [0.03]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3]
      model__reg_lambda: [1.0]
