name: ci

on:
  push:
    branches: [main, english]
  pull_request:

jobs:
  tests-and-smoke-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: make test
      - name: Verify the raw-data hashes (manifest)
        run: make verify
      - name: Data contract (provider's spec)
        run: make validate
      - name: Smoke run of the whole pipeline
        run: make smoke
