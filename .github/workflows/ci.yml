name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas-y-corrida-rapida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias
        run: make pruebas
      - name: Verificar los hashes de los datos originales (manifiesto)
        run: make verificar
      - name: Contrato de datos (especificación del proveedor)
        run: make validar
      - name: Corrida rápida de todo el flujo
        run: make rapida
