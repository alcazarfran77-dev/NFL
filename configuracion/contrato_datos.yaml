# Contrato de datos derivado de documentos/Data_structure_CSV_files.docx (especificación del proveedor).
# Se valida en cada ejecución (fuentes/datos_prep.py, etapa "contrato"); el reporte queda en
# reportes/metricas/data_contract_*.
#
# Por columna:  type      int | float | str | bool | datetime (bool acepta TRUE/FALSE, True/False, 1/0, 1.0/0.0)
#               nullable  true si la especificación admite nulos o la columna depende del rol
#                         (p. ej. los campos solo de la OL son nulos para receptores); por defecto false
#               range     [mín, máx] que indica la especificación (inclusivo)
#               values    códigos permitidos por la especificación
#               pattern   expresión regular que deben cumplir los valores
# Severidad: archivo / columna obligatoria faltante, clave duplicada, clave foránea rota = error;
#            desviaciones de tipo, nulos, rango, valores y número de filas = warning (las tratan las reglas de negocio).
# Las claves (nombres de tabla, columna y comprobación) quedan en inglés: son las de los archivos del proveedor.

files:
  players:
    spec_name: players.csv
    patterns: ["players.csv*"]
    required: true
    expected_rows: 510
    key: [nfl_id]
    columns:
      nfl_id: {type: int}
      display_name: {type: str}
      draft_year: {type: int, values: [2023, 2024, 2025]}
      nfl_position: {type: str, values: [WR, CB, T, G, C, DT, DE, OLB, TE, SS, FS, NT, DB, ILB, MLB, RB, FB]}
      birth_date: {type: str, pattern: '^\d{4}-\d{2}-\d{2}$'}
      college_name: {type: str}
      college_conference: {type: str}
      draft_round: {type: int, nullable: true, range: [1, 7]}
      draft_pick_within_round: {type: int, nullable: true, range: [1, 300]}
      draft_overall_pick: {type: int, nullable: true, range: [1, 300]}

  combine:
    spec_name: combine_results.csv
    patterns: ["combine_results.csv*"]
    required: true
    expected_rows: 510
    key: [nfl_id]
    foreign_keys: {nfl_id: players.nfl_id}
    columns:
      draft_year: {type: int, values: [2023, 2024, 2025]}
      nfl_id: {type: int}
      combine_position: {type: str}
      combine_height: {type: float, range: [60, 90]}
      combine_weight: {type: int, range: [120, 420]}
      hand_size: {type: float, range: [6, 13]}
      arm_length: {type: float, range: [25, 40]}
      wing_span: {type: float, range: [60, 95]}
      ten_yd_split: {type: float, nullable: true, range: [1.2, 2.5]}
      forty: {type: float, nullable: true, range: [4.0, 6.5]}
      vertical: {type: float, nullable: true, range: [10, 50]}
      broad_jump: {type: float, nullable: true, range: [60, 160]}
      three_cone: {type: float, nullable: true, range: [6.0, 9.5]}
      short_shuttle: {type: float, nullable: true, range: [3.5, 6.0]}
      bench_reps: {type: float, nullable: true, range: [0, 60]}
      ngs_athleticism_score: {type: int, range: [0, 100]}
      ngs_college_production_score: {type: float, nullable: true, range: [0, 100]}
      ngs_final_score: {type: float, nullable: true, range: [0, 100]}

  combine_tracking:
    spec_name: combine_tracking.csv
    patterns: ["combine_tracking*.csv*"]
    required: false                # opcional: activa las variables del tracking de pruebas cuando está presente
    expected_attempts: 6310
    key: [event_id, entity_type, time]
    foreign_keys: {nfl_id: players.nfl_id}
    columns:
      draft_year: {type: int, values: [2023, 2024, 2025]}
      event_id: {type: str}
      nfl_id: {type: int, nullable: true}
      entity_type: {type: str, values: [PLAYER, BALL]}
      time: {type: datetime}
      drill_type: {type: str}
      drill_name: {type: str}
      attempt: {type: int, range: [1, 50]}
      x: {type: float, range: [0, 120]}
      y: {type: float, range: [0, 53.33]}
      s: {type: float, range: [0, 15]}
      a: {type: float, range: [0, 20]}
      dis: {type: float, range: [0, 2]}
      dir: {type: float, nullable: true, range: [0, 360]}

  careers:
    spec_name: player_career_successes.csv
    patterns: ["player_career_successes.csv*"]
    required: true
    expected_rows: 510
    key: [nfl_id]
    foreign_keys: {nfl_id: players.nfl_id}
    columns:
      nfl_id: {type: int}
      career_offensive_snaps: {type: int, range: [0, 10000]}
      career_defensive_snaps: {type: int, range: [0, 10000]}
      career_special_teams_snaps: {type: int, range: [0, 10000]}
      career_games_active: {type: int, range: [0, 51]}
      career_games_started: {type: int, range: [0, 51]}
      ap_all_pro_1st_team: {type: int, range: [0, 3]}
      ap_all_pro_2nd_team: {type: int, range: [0, 3]}
      pro_bowl_original_ballot: {type: int, range: [0, 3]}

  player_play:
    spec_name: player_play.csv
    patterns: ["player_play*.csv*"]
    required: false
    expected_rows: 316338
    key: [game_id, play_id, nfl_id]
    foreign_keys: {nfl_id: players.nfl_id, game_id: games.game_id}
    columns:
      # A. Contexto de la jugada e identificadores
      game_id: {type: int}
      play_id: {type: int}
      team_abbr: {type: str, pattern: '^[A-Z]{2,3}$'}
      nfl_id: {type: int}
      lined_up_position: {type: str, nullable: true}
      play_description: {type: str}
      quarter: {type: int, values: [1, 2, 3, 4, 5]}
      down: {type: int, values: [1, 2, 3, 4]}
      yards_to_go: {type: int, range: [0, 99]}
      possession_team: {type: str, pattern: '^[A-Z]{2,3}$'}
      yardline_side: {type: str, nullable: true}
      yardline_number: {type: int, range: [1, 50]}
      game_clock: {type: str, pattern: '^\d{2}:\d{2}$'}
      pre_snap_home_score: {type: int, range: [0, 100]}
      pre_snap_visitor_score: {type: int, range: [0, 100]}
      play_direction: {type: str, values: [left, right]}
      # B. Probabilidad de victoria y puntos esperados
      pre_snap_home_team_win_probability: {type: float, range: [0, 1]}
      pre_snap_visitor_team_win_probability: {type: float, range: [0, 1]}
      home_team_win_probability_added: {type: float, range: [-1, 1]}
      visitor_team_win_probility_added: {type: float, range: [-1, 1]}   # escrito así en la especificación y en el archivo
      expected_points_added: {type: float, range: [-15, 15]}
      expected_points: {type: float, range: [-10, 10]}
      # C. Esquemas, formaciones y resultados
      offense_formation: {type: str, nullable: true}
      receiver_alignment: {type: str, nullable: true, pattern: '^\d+x\d+$'}
      pass_result: {type: str, nullable: true, values: [C, I, S, IN, R]}
      pass_length: {type: float, nullable: true, range: [-30, 80]}
      play_nullified_by_penalty: {type: str, values: [Y, N]}
      penalty_yards: {type: float, nullable: true}
      pre_penalty_yards_gained: {type: int}
      yards_gained: {type: int}
      team_coverage_man_zone: {type: str, nullable: true, values: [MAN_COVERAGE, ZONE_COVERAGE]}
      team_coverage_type: {type: str, nullable: true}
      in_motion_at_ball_snap: {type: bool, nullable: true}
      # D. Receptor y portador del balón
      target: {type: bool}
      rec_yards: {type: float, nullable: true}
      rush_yards: {type: float, nullable: true}
      yards_after_catch: {type: float, nullable: true}
      fumble: {type: float, nullable: true, values: [0, 1]}
      fumble_lost: {type: float, nullable: true, values: [0, 1]}
      route_ran: {type: str, nullable: true}
      separation_at_pass_forward: {type: float, nullable: true, range: [0, 60]}
      cushion: {type: float, nullable: true, range: [0, 40]}
      expected_yards_after_catch: {type: float, nullable: true}
      # E. Línea ofensiva y protección de pase
      dropback_duration: {type: float, nullable: true, range: [0, 20]}
      extended_sack_allowed: {type: float, nullable: true, values: [0, 0.5, 1]}
      pass_rushers_encountered: {type: float, nullable: true, range: [0, 5]}
      peak_pressure_probability_allowed: {type: float, nullable: true, range: [0, 1]}
      pressure_allowed: {type: bool, nullable: true}
      sack_allowed: {type: float, nullable: true, values: [0, 0.5, 1]}
      time_to_pressure_allowed: {type: float, nullable: true, range: [0, 20]}
      # F. Presión defensiva al pasador y tacleadas
      blitzing: {type: bool, nullable: true}
      player_get_off: {type: float, nullable: true, range: [0, 2]}
      sack: {type: float, nullable: true, values: [0, 0.5, 1]}
      tackle: {type: float, nullable: true, values: [0, 1]}
      assist: {type: float, nullable: true, values: [0, 1]}
      caused_forced_fumble: {type: float, nullable: true, values: [0, 1]}
      recovered_fumble: {type: bool, nullable: true, spec_type: float}   # especificación: float 1.0/null; archivo: TRUE/FALSE
      tackle_for_loss: {type: bool, nullable: true, spec_type: float}   # especificación: float 1.0/null; archivo: TRUE/FALSE
      time_to_pressure: {type: float, nullable: true, range: [0, 20]}
      time_to_qb_hurry: {type: float, nullable: true, range: [0, 20]}
      coverage_assignment: {type: str, nullable: true}
      coverage_assignment_at_snap: {type: str, nullable: true}
      quick_pressure: {type: bool, nullable: true, spec_type: float}   # especificación: float 1.0/null; archivo: TRUE/FALSE
      unblocked_pressure: {type: bool, nullable: true, spec_type: float}   # especificación: float 1.0/null; archivo: TRUE/FALSE

  games:
    spec_name: games.csv
    patterns: ["games.csv*"]
    required: true
    expected_rows: 1002
    key: [game_id]
    columns:
      game_id: {type: int, pattern: '^\d{10}$'}
      game_key: {type: int}
      season: {type: int, values: [2023, 2024, 2025]}
      season_type: {type: str, values: [REG, POST]}
      week: {type: int, range: [1, 18]}
      home_team_abbr: {type: str, pattern: '^[A-Z]{2,3}$'}
      visitor_team_abbr: {type: str, pattern: '^[A-Z]{2,3}$'}

  tracking:
    spec_name: game_tracking_2023.csv, game_tracking_2024.csv, game_tracking_2025.csv
    patterns: ["game_tracking_*.csv*"]      # también encuentra partes como game_tracking_2024_2.csv
    required: false
    expected_seasons: [2023, 2024, 2025]
    expected_players: 510
    key: [game_id, play_id, nfl_id, time]
    foreign_keys: {nfl_id: players.nfl_id, game_id: games.game_id}
    soft_foreign_keys: {"game_id,play_id,nfl_id": player_play}   # solo advertencia
    columns:
      game_id: {type: int}
      play_id: {type: int}
      nfl_id: {type: int}
      time: {type: datetime}
      x: {type: float, range: [0, 120]}
      y: {type: float, range: [0, 53.33]}
      s: {type: float, range: [0, 15]}
      a: {type: float, range: [0, 20]}
      dis: {type: float, range: [0, 2]}
      o: {type: float, range: [0, 360]}
      dir: {type: float, range: [0, 360]}
      event: {type: str, nullable: true}

# Cómo trata el flujo cada desviación conocida (se une al reporte como columna `handling`).
# Clave: <tabla>.<columna>.<comprobación sin su [rango]> ; "*" coincide con cualquier columna.
handling:
  games.season_type.allowed_values: "La pretemporada (PRE) está fuera de la especificación. Las métricas de campo usan solo REG (R10); el tracking conserva REG + POST (R8b)."
  games.week.range: "Las semanas 0-3 son pretemporada y 19-23 playoffs (especificación: 1-18). La semana no es variable del modelo."
  player_play.down.allowed_values: "R15: el down 0 (conversiones de dos puntos) se quita de las jugadas de campo; ninguna era de las familias DL/OL/WR-TE."
  player_play.play_direction.not_null: "Columna no usada."
  player_play.pre_snap_home_team_win_probability.not_null: "Columna no usada."
  player_play.pre_snap_visitor_team_win_probability.not_null: "Columna no usada."
  player_play.home_team_win_probability_added.not_null: "Columna no usada."
  player_play.visitor_team_win_probility_added.not_null: "Columna no usada."
  player_play.pass_length.range: "Columna no usada."
  player_play.tackle.allowed_values: "Columna no usada."
  player_play.*.encoding: "La lee el lector booleano, que acepta texto TRUE/FALSE y flotantes 1.0/0.0."
  player_play.*.row_count: "Los resultados usan las filas entregadas; se solicita el archivo completo de la especificación."
  tracking.x.range: "Se conservan: los jugadores salen del campo (bandas, zonas de anotación). Las métricas usan desplazamiento y velocidad, no la posición."
  tracking.y.range: "Se conservan: los jugadores salen del campo (bandas, zonas de anotación). Las métricas usan desplazamiento y velocidad, no la posición."
  tracking.dis.range: "Columna no usada (la distancia sale de x/y y la velocidad de s)."
  tracking.game_id,play_id,nfl_id.soft_foreign_key: "Estas jugadas con tracking conservan sus métricas de movimiento pero no reciben contexto de jugada (solo lo usa la comprobación de fiabilidad ajustada por contexto)."
  tracking.season.season_coverage: "Los análisis de tracking usan las temporadas entregadas; se solicitan los archivos de temporada faltantes."
  tracking.nfl_id.player_coverage: "Los prospectos con 3+ jugadas registradas reciben SBI (R9; conteo en data_audit.json, players_profiled). Los prospectos sin tracking nunca jugaron un snap muestreado."
  tracking.*.superseded_part: "Una parte se ignora cuando existe el archivo completo de la temporada."
  player_play.*.superseded_part: "Una parte se ignora cuando existe el archivo completo."
  combine_tracking.*.file_present: "No entregado. Las variables del tracking de pruebas se activan cuando se agrega el archivo."
  combine_tracking.y.range: "La prueba de 40 yardas corre en un carril fuera del marco del campo de 0-53.3 yd (la mayoría de los cuadros fuera de rango). Las métricas usan desplazamiento y velocidad, no la posición."
  combine_tracking.s.range: "Solo filas del balón (pases en las pruebas de posición); R16 descarta las filas del balón."
  combine_tracking.a.range: "Solo filas del balón; R16 descarta las filas del balón."
  combine_tracking.dis.range: "Solo filas del balón; dis no se usa."
  combine_tracking.*.superseded_part: "Una parte se ignora cuando existe el archivo completo."
  tracking.*.spreadsheet_row_limit: "Las filas no siguen ningún orden, así que el corte quita un subconjunto aleatorio de jugadas; la última jugador-jugada del archivo puede estar incompleta y se descarta (R8c). Se solicita el archivo sin cortar."
  player_play.*.spreadsheet_row_limit: "Se solicita el archivo sin cortar."
