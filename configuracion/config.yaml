# Proyecto NFL — Combine-to-Game Movement Translation (CGMT)
# Fuente única de verdad para rutas, reglas de negocio, esquema de validación cruzada y rejillas de búsqueda.
# Todo cambio aquí se registra en CHANGELOG.md y sube la versión del flujo.
# Las claves se mantienen en inglés porque el código las lee por nombre; los comentarios explican cada una.

project: cgmt
seed: 42                           # semilla global: Python, NumPy, PYTHONHASHSEED y random_state de cada modelo

paths:                             # relativas a la raíz del repositorio
  raw: datos/datos_ini             # datos originales (CSV comprimidos .csv.gz, solo lectura)
  interim: datos/datos_limp/intermedios   # cuadros de tracking limpios y contexto de jugada
  processed: datos/datos_limp      # datos limpios listos para modelar (parquet)
  manifest: datos/datos_ini/manifiesto.json   # hash SHA-256 de cada archivo original + data_version
  reports: reportes
  figures: reportes/figuras
  metrics: reportes/metricas

raw_files:                         # nombres o patrones glob (documentos/Data_structure_CSV_files.docx)
  combine: combine_results.csv*
  players: players.csv*
  careers: player_career_successes.csv*
  games: games.csv*
  tracking: "game_tracking_*.csv*"   # especificación: game_tracking_2023/2024/2025.csv; entregado en partes
                                     # (_2023_5, _2024_1_5, _2024_2, _2025_2)
  player_play: "player_play*.csv*"   # especificación: player_play.csv; entregado como player_play_3.csv
  combine_tracking: "combine_tracking*.csv*"   # archivo 3 de la especificación: tracking de las pruebas del Combine
                                     # una parte <raíz>_<n>.csv se ignora si existe el archivo completo <raíz>.csv;
                                     # .csv y .csv.gz se aceptan por igual

contract:
  path: configuracion/contrato_datos.yaml   # se valida en cada etapa de datos -> reportes/metricas/data_contract_*
  fail_on_error: true                # archivo/columna obligatoria faltante, clave duplicada o clave foránea rota

mlflow:
  tracking_uri: sqlite:///mlflow/mlflow.db
  artifact_location: mlflow/mlartifacts
  experiment: cgmt-combine-translation
  register_models: true
  regressor_name: cgmt-snap-burst-regressor        # sufijo -dl / -wr para línea defensiva y receptores
  onfield_regressor_prefix: cgmt-onfield            # + "-<tarea>" para los objetivos de campo
  classifier_name: cgmt-starter-classifier

business_rules:
  last_completed_season: 2025      # la tabla de carreras cubre temporadas hasta 2025
  games_per_season: 17
  starter_threshold: 0.5           # titular = inició >= 50% de los partidos de temporada regular disponibles
  undrafted_pick: 260              # después del último turno observado (257)
  draft_reference_month_day: "04-27"   # fin de semana aproximado del draft, para la edad al draft
  power_conferences:
    - Southeastern Conference
    - Big Ten Conference
    - Atlantic Coast Conference
    - Big Twelve Conference
    - Pacific Twelve Conference
  drill_valid_ranges:              # R1: valores fuera del rango se vuelven NaN (error de medición)
    combine_height: [64, 84]
    combine_weight: [140, 400]
    hand_size: [7, 12]
    arm_length: [27, 38]
    wing_span: [66, 90]
    ten_yd_split: [1.30, 2.20]
    forty: [4.10, 6.00]
    vertical: [15, 50]
    broad_jump: [70, 150]
    three_cone: [6.20, 9.00]
    short_shuttle: [3.70, 5.60]
    bench_reps: [0, 50]

tracking_rules:
  season_types: [REG, POST]        # R8b: se excluye la pretemporada (98 partidos, 390,373 cuadros)
  frame_rate_hz: 10
  snap_events: [ball_snap, snap_direct]
  min_post_snap_frames: 20         # R8: hacen falta 2.0 s completos tras el snap
  burst_horizon_s: 2.0             # métrica principal: distancia recorrida en t = 2.0 s
  get_off_horizon_s: 1.0
  cut_window_s: 0.5
  cut_min_speed: 2.0               # yd/s en ambos extremos de la ventana del corte
  speed_cap: 12.5                  # yd/s (~25.6 mph); por encima = falla del sensor
  accel_cap: 15.0                  # yd/s^2
  min_plays_per_player: 3          # R9
  capacity_quantile: 0.80          # solo sensibilidad: sesgado a la baja con pocas jugadas (CHANGELOG 0.4.0)
  sbi_center: 50                   # escala del Snap Burst Index: 50 + 10 * z
  sbi_scale: 10

performance_rules:                 # rendimiento en el campo desde player_play
  season_types: [REG]              # R10: el reto pregunta por el rendimiento en temporada regular
  exclude_nullified: true          # R11: las jugadas anuladas por castigo no cuentan
  valid_downs: [1, 2, 3, 4]        # R15: down 0 = conversiones de dos puntos (especificación: 1-4)
  alignment_codes:                 # lined_up_position -> celda de alineación; códigos de los datos + de la especificación (DE, DT, NT)
    DL: {EDGE: EDGE, DE: EDGE, INTERIOR_LINE: INTERIOR_LINE, DT: INTERIOR_LINE, NT: INTERIOR_LINE}
    OL: {T: T, G: G, C: C}
    WRTE: {WR: WR, SLOT_WR: SLOT_WR, TE: TE}
                                   # cualquier otro -> OTHER (OLB queda en OTHER: alineación fuera de la línea o de pie)
  families:                        # posición del Combine -> familia de campo con un resultado medible
    DL: DL
    OL: OL
    WR: WRTE
    TE: WRTE
  get_off_valid_s: [0.30, 2.00]    # R12: arranque NGS fuera de este rango = artefacto del tracking (21 jugadas, < 0.1%)
  dropback_quantiles: 5            # lo esperado de la OL: alineación x quintil de duración del dropback
  min_plays:                       # R13: mínimo de jugadas válidas para una métrica de jugador
    dl_rush: 20
    ol_pass_block: 50
    wrte_route: 30
  primary_metric:                  # un índice de campo por familia (lo usan los clasificadores)
    DL: proe
    OL: ppoe
    WRTE: soe

combine_tracking_rules:            # R16, archivo 3 de la especificación (combine_tracking_6.csv)
  frame_rate_hz: 10
  start_speed: 0.5                 # yd/s: el intento empieza en el cuadro anterior al primero a esta velocidad
  min_frames: 15                   # se descartan los intentos de menos de 1.5 s tras la salida
  speed_cap: 12.5                  # mismos topes físicos que el tracking de partido
  accel_cap: 15.0
  plant_drop: 0.5                  # un giro = un mínimo de velocidad por debajo del 50% del pico anterior (3 conos, shuttle)
  cut_window_s: 0.5
  cut_min_speed: 2.0
  min_reliability: 0.5             # una métrica de prueba solo es variable si se repite con r >= 0.5

cv:
  outer_splits: 5                  # validación cruzada anidada: 5 pliegues x 3 repeticiones por fuera
  outer_repeats: 3
  inner_splits: 3                  # GridSearchCV de 3 pliegues por dentro
  bootstrap_resamples: 2000

regression:
  populations: [all_positions, defensive_line, wide_receivers]   # posiciones únicas = donde el snap burst es un
                                   # rasgo fiable (DL ICC 0.63, WR 0.62 con tracking de temporada completa)
  target: sbi                      # Snap Burst Index: z dentro de la posición del burst de 2 s contraído (50 +/- 10)
  combine_tracking_comparison: true   # atlético vs atlético + tracking de pruebas (solo con combine_tracking.csv)
  onfield_tasks:                   # Combine -> rendimiento en el campo (contraído, sobre lo esperado)
    - {name: dl_getoff, positions: [DL], target: goe_eb, label: "Arranque DL sobre lo esperado (s)"}
    - {name: dl_pressure, positions: [DL], target: proe_eb, label: "Tasa de presión DL sobre lo esperado"}
    - {name: ol_protection, positions: [OL], target: ppoe_eb, label: "Prob. de presión OL sobre lo esperado"}
    - {name: wrte_separation, positions: [WR, TE], target: soe_eb, label: "Separación WR/TE sobre lo esperado (yd)"}
  grids:
    ridge:
      model__alpha: [1.0, 10.0, 100.0, 300.0, 1000.0]
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3, 6, null]
      model__min_samples_leaf: [3, 10]
      model__max_features: [0.33, 0.66]
    xgboost:
      model__n_estimators: [200, 400]
      model__max_depth: [2, 3]
      model__learning_rate: [0.03, 0.1]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3, 8]
      model__reg_lambda: [1.0]

classification:
  target: is_starter
  projector_alpha: 10.0            # penalización Ridge del proyector apilado Combine -> campo
  projector_inner_folds: 5         # proyecciones fuera de pliegue para las filas de entrenamiento
  scoring: roc_auc
  decision_threshold: 0.5
  grids:
    logistic_regression:
      model__C: [0.01, 0.1, 1.0, 10.0]
      model__l1_ratio: [0.0, 1.0]     # 0 = ridge (L2), 1 = lasso (L1)
    random_forest:
      model__n_estimators: [200]
      model__max_depth: [3, 6, null]
      model__min_samples_leaf: [3, 10]
      model__max_features: [0.33, 0.66]
    xgboost:
      model__n_estimators: [200, 400]
      model__max_depth: [2, 3]
      model__learning_rate: [0.03, 0.1]
      model__subsample: [0.8]
      model__colsample_bytree: [0.8]
      model__min_child_weight: [3, 8]
      model__reg_lambda: [1.0]
