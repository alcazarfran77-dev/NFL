# Metadatos del proyecto y configuración de pytest. El código vive en fuentes/ (dos módulos: datos_prep y train).
[project]
name = "nfl-combine"
version = "3.1.0"
description = "Proyecto NFL: ¿se traduce el movimiento en las pruebas del Combine al movimiento y rendimiento en partidos de temporada regular?"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["fuentes", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
