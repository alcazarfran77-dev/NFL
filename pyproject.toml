# Project metadata and pytest configuration. The code lives in src/ (two modules: data_prep and train).
[project]
name = "nfl-combine"
version = "3.2.0"
description = "NFL project: does Combine drill movement translate into regular-season game movement and on-field performance?"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
